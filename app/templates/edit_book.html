<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Book</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Title</label>

                    <input
                        type="text"
                        name="title"
                        value="{{ book.title }}"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Author</label>

                    <input
                        type="text"
                        name="author"
                        value="{{ book.author }}"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Publication Year</label>

                    <input
                        type="number"
                        name="publication_year"
                        value="{{ book.publication_year }}"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Language</label>

                    <input
                        type="text"
                        name="language"
                        value="{{ book.language }}"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">ISBN</label>

                    <input
                        type="text"
                        name="isbn"
                        value="{{ book.isbn }}"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Total Copies</label>

                    <input
                        type="number"
                        name="copies_total"
                        value="{{ book.copies_total }}"
                        class="form-control"
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-warning">
                    Update Book
                </button>

                <a href="{{ url_for('books.list_books') }}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
