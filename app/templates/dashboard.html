<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">
        Dashboard
    </h1>

    <div class="row">

        <div class="col-md-4">

            <div class="card p-4 shadow text-center">

                <h3>Total Books</h3>

                <p class="display-6">
                    120
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-4 shadow text-center">

                <h3>Users</h3>

                <p class="display-6">
                    45
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-4 shadow text-center">

                <h3>Borrowed</h3>

                <p class="display-6">
                    18
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
