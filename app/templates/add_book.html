<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add New Book</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Title</label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Author</label>

                    <input
                        type="text"
                        name="author"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Publication Year</label>

                    <input
                        type="number"
                        name="publication_year"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Language</label>

                    <input
                        type="text"
                        name="language"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">ISBN</label>

                    <input
                        type="text"
                        name="isbn"
                        class="form-control"
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">Total Copies</label>

                    <input
                        type="number"
                        name="copies_total"
                        class="form-control"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success">
                    Add Book
                </button>

                <a href="{{ url_for('books.list_books') }}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
