<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Flask Auth</title>
  <style>
    :root {
      --bg: #f3f7fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #dbe4ef;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #ecfdf3;
      --success-text: #166534;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --warning-bg: #fff8e8;
      --warning-text: #92400e;
      --info-bg: #eff6ff;
      --info-text: #1e3a8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      padding: 1rem;
    }

    .card {
      width: min(460px, 94vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
      padding: 1.4rem;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 0.6rem;
    }

    .flash-list {
      list-style: none;
      display: grid;
      gap: 0.55rem;
      margin: 0 auto 1rem;
      text-align: left;
    }

    .flash {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.68rem 0.8rem;
      font-size: 0.92rem;
      font-weight: 500;
    }

    .flash-success { background: var(--success-bg); color: var(--success-text); border-color: #bbf7d0; }
    .flash-error { background: var(--error-bg); color: var(--error-text); border-color: #fecaca; }
    .flash-warning { background: var(--warning-bg); color: var(--warning-text); border-color: #fde68a; }
    .flash-info { background: var(--info-bg); color: var(--info-text); border-color: #bfdbfe; }

    .logout {
      display: inline-block;
      margin-top: 1rem;
      border: 0;
      border-radius: 10px;
      padding: 0.68rem 0.9rem;
      font-weight: 600;
      font-size: 0.94rem;
      color: #fff;
      background: var(--primary);
      text-decoration: none;
    }

    .logout:hover {
      background: var(--primary-hover);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <h1>Hello, {{ current_user.username }}</h1>
    <a class="logout" href="{{ url_for('auth.logout') }}">Logout</a>
  </main>
</body>
</html>
